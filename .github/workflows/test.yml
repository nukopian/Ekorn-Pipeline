name: test

on:
  push:
    branches: [main, develop]
  pull_request:
  # By hand, to test a commit again:
  # gh workflow run test.yml --ref develop
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to a commit, as a tag can be moved to other code;
# the comment beside each says which release it is.

jobs:
  # Each job's modules are installed by actions-setup-perl, into local/,
  # which it caches, keyed on the Perl, cpanm's arguments, the cpanfile
  # and the modules it's given by name; so a job installs nothing until
  # one of those changes (roadmap 2026-0047). A job with no cache of its
  # own key restores the newest with the same Perl, cpanm arguments and
  # cpanfile, or failing that the same Perl alone, and installs what it
  # lacks on top, so after a cpanfile change, or on its first run, a job
  # may start with another job's modules. The cache keeps the versions
  # it was made with: to install the newest, delete the caches, as
  # docs/MAINTAINING.md says. --with-recommends brings
  # Text::Redact::Secrets, so that dump_to's tests run with it, in each
  # job that runs the tests but the minimal one.

  # The tests on Perl 5.36, the floor, to the newest on Linux. macOS
  # was dropped on 2026-11-23, its runners being unreliable, as
  # DBIx-Squirrel dropped it. Of the develop modules, they need only
  # yath, and UUID, which the cpanfile lists beside it, so those are
  # named, and the rest left to the style and coverage jobs.
  perl:
    name: perl ${{ matrix.perl }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        perl: ["5.36", "5.38", "5.40", "5.42", "5.44"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: ${{ matrix.perl }}
          install-modules-with: cpanm
          install-modules-args: --with-recommends
          install-modules: |
            Test2::Harness
            UUID
      - name: yath
        run: yath test

  # The tests on Windows, at Perl 5.36 and 5.42, as CPAN Testers'
  # Windows testers run them, as they found what Linux doesn't:
  # text mode writes "\r\n". yath doesn't support Windows, so prove runs
  # t/, as an installer would, without the develop modules. Git is told
  # not to turn LF into CRLF, so the files are as the tarball has them.
  #
  # Strawberry Perl, as most of those testers have, as DBIx-Squirrel's
  # CI does. setup-perl's own Windows builds broke XS modules from 5.42:
  # on 5.44, Variable::Magic crashed perl as it exited, and a
  # Cpanel::JSON::XS built afresh killed the tests that load it, as
  # DBD::SQLite failed to build for DBIx-Squirrel (roadmap 2026-0047).
  # Not 5.44, which no tester runs on Windows.
  windows:
    name: perl ${{ matrix.perl }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        perl: ["5.36", "5.42"]
    steps:
      - name: LF as it is
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: ${{ matrix.perl }}
          distribution: strawberry
          install-modules-with: cpanm
          install-modules-args: --with-recommends
      - name: prove
        run: prove -l t

  # The tests with only what's required, without what's recommended, as
  # many of CPAN Testers' smokers run them: from v0.3.10 to v0.4.4,
  # t/30-csv.t failed on every one of those without Text::CSV, which
  # the jobs above all install. prove runs t/, as an installer would. A
  # recommended module pulled in by another dependency fails the job,
  # as it would no longer test the case it's here for. It has no cache:
  # on its first run, with no cache of its own key, it fell back to the
  # coverage job's, on the same Perl, and so had the recommended
  # modules too.
  minimal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: "5.36"
          install-modules-with: cpanm
          enable-modules-cache: false
      - name: nothing recommended
        run: |
          status=0
          for m in Text::CSV Text::Redact::Secrets; do
            if perl -M"$m" -e 1 2>/dev/null; then
              echo "::error::$m is installed, so this job doesn't test without it"
              status=1
            fi
          done
          exit $status
      - name: prove
        run: prove -l t

  # Perl::Critic and Perl::Tidy, with the repository's profiles, on the
  # newest Perl. A file perltidy would change fails, showing the diff.
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: "5.44"
          install-modules-with: cpanm
          install-modules-args: --with-develop --with-recommends
      - name: perlcritic
        run: perlcritic lib
      - name: perltidy
        run: |
          status=0
          for f in $(git ls-files 'lib/*.pm' 't/*.t' 'xt/*.t'); do
            perltidy "$f" | diff -u "$f" - || status=1
          done
          exit $status

  # The tests under Devel::Cover, on Perl 5.36, the floor, failing if the
  # coverage of lib/ falls below the floors in scripts/coverage. There's
  # no MySQL or PostgreSQL here, so the floors are what SQLite reaches.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: "5.36"
          install-modules-with: cpanm
          install-modules-args: --with-develop --with-recommends
      - name: coverage
        run: scripts/coverage

  # Secrets in any commit, not only the latest: betterleaks over the whole
  # history, since all of it is published with the repository, with the
  # allowlist in .betterleaks.toml (roadmap 2026-0039). Its release is
  # checked against its published SHA-256 before it's used.
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history
      - name: betterleaks
        env:
          VERSION: 1.10.1
          SHA256: c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e
        run: |
          tarball="betterleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "https://github.com/betterleaks/betterleaks/releases/download/v$VERSION/$tarball"
          echo "$SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" betterleaks
          "$RUNNER_TEMP/betterleaks" git --config .betterleaks.toml --redact --no-banner --exit-code 1 .
